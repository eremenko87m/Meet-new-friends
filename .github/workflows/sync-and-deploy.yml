name: Sync Yandex Table and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 8

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6

        with:
          python-version: "3.12"

      - name: Install sync dependencies

        run: |
          pip install requests openpyxl pillow

      - name: Sync fresh data from Yandex Table

        run: |
          python scripts/sync_yandex.py

      - name: Show sync result

        run: |

          python - <<'PY'

          import json

          from pathlib import Path

          p = Path(
              "data/exercises.json"
          )

          d = json.loads(
              p.read_text(
                  encoding="utf-8"
              )
          )

          print(
              "generatedAt:",
              d.get(
                  "generatedAt"
              )
          )

          print(
              "source:",
              d.get(
                  "source"
              )
          )

          for (
              name,
              cards,
          ) in d.get(
              "sections",
              {}
          ).items():

              populated = sum(

                  bool(
                      c.get("title")
                      or c.get("link")
                      or c.get("audio")
                      or c.get("image")
                      or c.get("notes")
                  )

                  for c in cards
              )

              with_images = sum(

                  bool(
                      c.get(
                          "image"
                      )
                  )

                  for c in cards
              )

              print(
                  f"{name}: "
                  f"{populated} "
                  "populated cards; "
                  f"{with_images} "
                  "with images"
              )

          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4

        with:
          path: .

  deploy:

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4
